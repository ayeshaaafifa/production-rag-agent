services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      INNGEST_DEV: "1"
    depends_on:
      - qdrant
    ports:
      - "8000:8000"

  inngest:
    image: inngest/inngest
    command: inngest dev -u http://backend:8000/api/inngest --no-discovery
    ports:
      - "8288:8288"
    depends_on:
      - backend

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8501:8501"
    depends_on:
      - qdrant
      - backend

volumes:
  qdrant_data: